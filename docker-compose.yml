version: "3.9"

services:
  # ---------- Message broker ----------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "15672:15672"   # management UI (http://localhost:15672 — guest/guest by default)
    expose:
      - "5672"           # AMQP port, internal only
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Databases (one per service) ----------
  auth-db:
    image: mysql:8
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: auth_db
    expose:
      - "3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) only answers once MySQL has finished its first-time setup
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  academic-db:
    image: mysql:8
    container_name: academic-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: academic_db
    expose:
      - "3306"
    volumes:
      - academic-db-data:/var/lib/mysql

  finance-db:
    image: mysql:8
    container_name: finance-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: finance_db
    expose:
      - "3306"
    volumes:
      - finance-db-data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  hr-db:
    image: mysql:8
    container_name: hr-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: hr_db
    expose:
      - "3306"
    volumes:
      - hr-db-data:/var/lib/mysql

  notification-db:
    image: mysql:8
    container_name: notification-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: notification_db
    expose:
      - "3306"
    volumes:
      - notification-db-data:/var/lib/mysql

  # ---------- Services ----------
  # NOTE: each Dockerfile below doesn't exist yet — add one per service as you build it.
  # Uncomment each block once that service has a working Dockerfile.

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    env_file: ./services/auth-service/.env
    depends_on:
      auth-db:
        condition: service_healthy   # wait until MySQL is actually accepting connections
    expose:
      - "4001"

  # academic-service:
  #   build: ./services/academic-service
  #   container_name: academic-service
  #   env_file: ./services/academic-service/.env
  #   depends_on:
  #     - academic-db
  #     - rabbitmq
  #   expose:
  #     - "4002"

  finance-service:
    build: ./services/finance-service
    container_name: finance-service
    ports:
     - "4003:4003"
    environment:
      PORT: 4003
      DB_HOST: finance-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      DB_NAME: finance_db
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      finance-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "4003"

  # hr-service:
  #   build: ./services/hr-service
  #   container_name: hr-service
  #   env_file: ./services/hr-service/.env
  #   depends_on:
  #     - hr-db
  #     - rabbitmq
  #   expose:
  #     - "4004"

  # notification-service:
  #   build: ./services/notification-service
  #   container_name: notification-service
  #   env_file: ./services/notification-service/.env
  #   depends_on:
  #     - notification-db
  #     - rabbitmq
  #   expose:
  #     - "4005"

  gateway:
    build: ./gateway
    container_name: gateway
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:4001
      ACADEMIC_SERVICE_URL: http://academic-service:4002
      FINANCE_SERVICE_URL: http://finance-service:4003
      HR_SERVICE_URL: http://hr-service:4004
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
    depends_on:
      - auth-service
      - finance-service
    ports:
      - "3000:3000"

volumes:
  auth-db-data:
  academic-db-data:
  finance-db-data:
  hr-db-data:
  notification-db-data:
