<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · School ERP</title>
  <!-- Same design as the rest of the ERP: the stylesheet served by auth-service. -->
  <link rel="stylesheet" href="/auth/css/styles.css">
  <link rel="stylesheet" href="css/notifications.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="logo" aria-hidden="true">ERP</span><span>School ERP<small>Notifications</small></span></div>
      <nav class="nav" aria-label="Sections">
        <a href="/auth/#/home">ERP home</a>
        <a href="/notifications/" aria-current="page">Notifications</a>
      </nav>
      <div class="who"><strong id="who"></strong><span id="who-role"></span><button id="logout" class="btn secondary sm" type="button">Sign out</button></div>
    </aside>
    <main class="main" id="view" tabindex="-1">
      <div class="page-head">
        <div>
          <h1>Notifications</h1>
          <p class="muted" id="summary">Loading…</p>
        </div>
        <div class="toolbar">
          <button id="show-all" class="btn secondary sm" type="button" aria-pressed="true">All</button>
          <button id="show-unread" class="btn secondary sm" type="button" aria-pressed="false">Unread</button>
          <button id="refresh" class="btn secondary sm" type="button">Refresh</button>
          <button id="read-all" class="btn sm" type="button">Mark all as read</button>
        </div>
      </div>
      <div id="msg" class="notice warn" role="alert" hidden></div>
      <ul id="list" class="card notif-list" aria-live="polite"></ul>
    </main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
