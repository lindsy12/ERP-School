<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · School ERP</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Sign-in -->
  <div id="login" class="login-wrap" hidden>
    <div class="card login-card">
      <h1>School ERP</h1>
      <p class="muted">Sign in to your school's account.</p>
      <div id="login-msg" class="notice warn" role="alert" hidden></div>
      <form id="login-form">
        <div class="field">
          <label for="tenant">School ID</label>
          <input id="tenant" name="tenant" autocomplete="organization" spellcheck="false" required>
          <span class="hint">Filled in for you when you open your school's sign-in link.</span>
        </div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button id="login-submit" class="btn" type="submit">Sign in</button>
      </form>
      <p class="muted small login-foot">Forgot your password? Ask your school administrator to reset it.</p>
    </div>
  </div>

  <!-- App shell -->
  <div id="shell" class="shell" hidden>
    <aside class="side">
      <div class="brand"><span class="logo" aria-hidden="true">ERP</span><span>School ERP<small>Accounts</small></span></div>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <div class="who"><strong id="who"></strong><span id="who-role"></span><button id="logout" class="btn secondary sm" type="button">Sign out</button></div>
    </aside>
    <main id="view" class="main" tabindex="-1"></main>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
