name: CI

# Runs the test suite and builds container images on every push to main and every PR into it,
# per the brief's DevOps requirement. Extend the matrix below as each service gets its own
# package.json and Dockerfile — right now this is a starting skeleton, not a finished pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/auth-service
          - services/academic-service
          - services/finance-service
          - services/hr-service
          - services/notification-service
          - gateway
    # hr-service's tests run against a real MySQL rather than an in-memory
    # SQLite fallback (no native node-gyp build required, dialect matches
    # prod) — see services/hr-service/README.md. Other services can point
    # their own tests at this same instance with a different DB_NAME, or
    # ignore it entirely if they don't need a DB in tests yet.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: hr_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: hr_db_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/auth-service
          - services/academic-service
          - services/finance-service
          - services/hr-service
          - services/notification-service
          - gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        run: docker build -t school-erp-$(basename $(pwd)) .
