name: CI

# Runs the test suite and builds container images on every push to main and every PR into it,
# per the brief's DevOps requirement. A service is skipped (not failed) until it has a
# package.json (for tests) or a Dockerfile (for the image build), so unscaffolded services
# don't block everyone else's PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Keep testing the other services when one fails, so each failure is reported on its own.
      fail-fast: false
      matrix:
        service:
          - services/auth-service
          - services/academic-service
          - services/finance-service
          - services/hr-service
          - services/notification-service
          - gateway
    # A fresh, throwaway MySQL container per matrix run (each service in the matrix gets its
    # own isolated instance — this is not shared between services). Only MYSQL_ROOT_PASSWORD
    # is needed here; each service's own test setup creates whatever database/schema it needs
    # once connected, so no single pre-created database name has to match every service.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: hr_db_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check whether the service has code yet
        id: check
        run: |
          if [ -f "${{ matrix.service }}/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.service }} has no package.json yet, skipping tests"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.service }}
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: rootpass
          TEST_DB_NAME: academic_db_test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/auth-service
          - services/academic-service
          - services/finance-service
          - services/hr-service
          - services/notification-service
          - gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check whether the service has a Dockerfile yet
        id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.service }} has no Dockerfile yet, skipping image build"
          fi

      - name: Build Docker image
        if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.service }}
        run: docker build -t school-erp-$(basename $(pwd)) .